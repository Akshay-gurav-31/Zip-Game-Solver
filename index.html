<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Zip Creator — Twin Box Precision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root.theme-dark {
            --bg: #080b11;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-2: rgba(255, 255, 255, 0.07);
            --border: rgba(255, 255, 255, 0.08);
            --border-bright: rgba(255, 255, 255, 0.18);
            --accent: #f97316;
            --accent-dim: rgba(249, 115, 22, 0.15);
            --accent-glow: rgba(249, 115, 22, 0.35);
            --text-primary: #f1f5f9;
            --text-muted: rgba(241, 245, 249, 0.45);
            --text-dim: rgba(241, 245, 249, 0.25);
            --success: #22d3ee;
            --error: #f43f5e;
            --mesh-opacity: 0.08;
            --noise-opacity: 0.025;
            --grid-line: rgba(255, 255, 255, 0.18);
            --grid-bg: rgba(10, 14, 22, 0.95);
            --wall-color: #ffffff;
        }

        :root.theme-light {
            --bg: #f8fafc;
            --surface: rgba(0, 0, 0, 0.02);
            --surface-2: rgba(0, 0, 0, 0.05);
            --border: rgba(0, 0, 0, 0.06);
            --border-bright: rgba(0, 0, 0, 0.12);
            --accent: #f97316;
            --accent-dim: rgba(249, 115, 22, 0.1);
            --accent-glow: rgba(249, 115, 22, 0.2);
            --text-primary: #0f172a;
            --text-muted: #64748b;
            --text-dim: #94a3b8;
            --success: #0891b2;
            --error: #e11d48;
            --mesh-opacity: 0.12;
            --noise-opacity: 0.015;
            --grid-line: rgba(0, 0, 0, 0.15);
            --grid-bg: #ffffff;
            --wall-color: #000000;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            transition: background-color 0.2s, color 0.15s linear;
            overflow-x: hidden;
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: var(--mesh-opacity);
        }

        .bg-mesh::before {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            top: -200px;
            left: -200px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            animation: drift 20s infinite alternate;
        }

        @keyframes drift {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(100px, 100px);
            }
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: var(--noise-opacity);
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .glass {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }

        .glass-bright {
            background: var(--surface-2);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-bright);
        }

        .cell {
            position: relative;
            cursor: pointer;
            transition: background 0.15s ease;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell:hover:not(.no-hover) {
            background: var(--accent-dim);
        }

        .cell-border-r {
            border-right: 1px solid var(--grid-line);
        }

        .cell-border-b {
            border-bottom: 1px solid var(--grid-line);
        }

        .wall-zone-v:hover {
            background: linear-gradient(to right, transparent, var(--accent-glow), transparent);
        }

        .wall-zone-h:hover {
            background: linear-gradient(to bottom, transparent, var(--accent-glow), transparent);
        }

        .num-ball {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            background: conic-gradient(from 135deg, #f97316, #fb923c, #f97316);
            color: #fff;
            box-shadow: 0 4px 20px rgba(249, 115, 22, 0.45);
            animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            z-index: 20;
            pointer-events: none;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }

            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .btn-primary {
            background: linear-gradient(135deg, #f97316, #ea6b12);
            color: white;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 24px rgba(249, 115, 22, 0.35);
            border: none;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 32px rgba(249, 115, 22, 0.5);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-ghost {
            background: var(--surface);
            border: 1px solid var(--border-bright);
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.72rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-ghost:hover {
            background: var(--surface-2);
            color: var(--text-primary);
        }

        .btn-nav {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--accent-dim);
            border-color: var(--accent-glow);
            color: var(--accent);
        }

        .btn-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border-bright);
            border-radius: 4px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .status-ok {
            border-color: var(--accent-glow);
            background: var(--accent-dim);
            color: var(--accent);
        }

        .status-err {
            border-color: rgba(244, 63, 94, 0.35);
            background: rgba(244, 63, 94, 0.08);
            color: var(--error);
        }

        .status-done {
            border-color: rgba(34, 211, 238, 0.35);
            background: rgba(34, 211, 238, 0.08);
            color: var(--success);
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(28px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .initial-fade {
            animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .page-wrap {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            overflow-x: hidden;
        }

        .top-bar {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: flex-end;
            padding: 0 4px;
            margin-bottom: 12px;
        }

        .content-row {
            display: flex;
            gap: 24px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1100px;
            flex: 1;
            padding: 10px 0 30px;
        }

        @media (max-width: 860px) {
            .content-row {
                flex-direction: column;
                align-items: center;
                flex: none;
            }

            .page-wrap {
                padding-bottom: 40px;
            }
        }

        .sidebar-wrap {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .grid-wrap {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .footer {
            padding: 16px 0;
            border-top: 1px solid var(--border);
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <div class="noise"></div>
    <div class="bg-mesh"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useCallback, useEffect, useLayoutEffect, useRef } = React;

        // ── ZIP SOLVER ENGINE ────────────────────────────────────────────────────
        class ZipSolver {
            constructor(gridSize, numbers, walls) {
                this.gridSize = gridSize; this.totalCells = gridSize * gridSize;
                this.numbers = numbers; this.walls = walls; this.numberPositions = {};
                this.allSolutions = []; this.visited = new Set();
                for (const [pos, num] of Object.entries(numbers)) {
                    const [r, c] = pos.split(',').map(Number);
                    this.numberPositions[num] = [r, c];
                }
            }
            isValid(r, c) { return r >= 0 && r < this.gridSize && c >= 0 && c < this.gridSize; }
            hasWallBetween(r1, c1, r2, c2) {
                if (!this.walls) return false;
                if (r1 === r2) { // Horizontal move
                    const cmin = Math.min(c1, c2);
                    if (this.walls.v[`${r1},${cmin}`]) return true;
                } else { // Vertical move
                    const rmin = Math.min(r1, r2);
                    if (this.walls.h[`${rmin},${c1}`]) return true;
                }
                return false;
            }
            getValidNeighbors(r, c) {
                const neighbors = [];
                for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                    const nr = r + dr, nc = c + dc, key = `${nr},${nc}`;
                    if (this.isValid(nr, nc) && !this.visited.has(key)) {
                        if (!this.hasWallBetween(r, c, nr, nc)) neighbors.push([nr, nc]);
                    }
                }
                return neighbors;
            }
            detectIsolated(testVisited) {
                const unvisited = [];
                for (let r = 0; r < this.gridSize; r++) for (let c = 0; c < this.gridSize; c++) if (!testVisited.has(`${r},${c}`)) unvisited.push([r, c]);
                if (!unvisited.length) return false;
                const start = unvisited[0], q = [start], seen = new Set([`${start[0]},${start[1]}`]);
                while (q.length) {
                    const [r, c] = q.shift();
                    for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                        const nr = r + dr, nc = c + dc;
                        if (this.isValid(nr, nc) && !testVisited.has(`${nr},${nc}`) && !seen.has(`${nr},${nc}`)) {
                            if (!this.hasWallBetween(r, c, nr, nc)) { seen.add(`${nr},${nc}`); q.push([nr, nc]); }
                        }
                    }
                }
                return seen.size < unvisited.length;
            }
            dfs(r, c, nextNum, path, startTime) {
                if (this.allSolutions.length >= 50) return;
                const key = `${r},${c}`; this.visited.add(key); path.push([r, c]);
                const maxNum = Math.max(...Object.values(this.numbers));
                if (path.length === this.totalCells) {
                    if (this.numbers[key] === maxNum) {
                        const now = performance.now();
                        const timeFound = (now - this.lastTime).toFixed(2);
                        this.lastTime = now;
                        this.allSolutions.push({ path: [...path], time: timeFound });
                    }
                    this.visited.delete(key); path.pop(); return;
                }
                const neighbors = this.getValidNeighbors(r, c);
                const targetPos = this.numberPositions[nextNum];
                if (targetPos) neighbors.sort((a, b) => (Math.abs(a[0] - targetPos[0]) + Math.abs(a[1] - targetPos[1])) - (Math.abs(b[0] - targetPos[0]) + Math.abs(b[1] - targetPos[1])));
                for (const [nr, nc] of neighbors) {
                    let next = nextNum; const nNum = this.numbers[`${nr},${nc}`];
                    if (nNum) {
                        if (nNum === nextNum) { if (nNum === maxNum && path.length !== this.totalCells - 1) continue; next++; }
                        else if (nNum > nextNum) continue;
                    }
                    if (this.detectIsolated(new Set([...this.visited, `${nr},${nc}`]))) continue;
                    this.dfs(nr, nc, next, path, startTime);
                }
                this.visited.delete(key); path.pop();
            }
            solve() {
                const s = this.numberPositions[1]; if (!s) return [];
                const t0 = performance.now();
                this.allSolutions = []; this.visited = new Set(); this.lastTime = t0;
                this.dfs(s[0], s[1], 2, [], t0);
                return this.allSolutions;
            }
        }

        // ── ICON ─────────────────────────────────────────────────────────────────
        const Icon = ({ name, size = 18, style = {} }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
                {name === 'sun' && <><circle cx="12" cy="12" r="5" /><line x1="12" y1="1" x2="12" y2="3" /><line x1="12" y1="21" x2="12" y2="23" /><line x1="4.22" y1="4.22" x2="5.64" y2="5.64" /><line x1="18.36" y1="18.36" x2="19.78" y2="19.78" /><line x1="1" y1="12" x2="3" y2="12" /><line x1="21" y1="12" x2="23" y2="12" /><line x1="4.22" y1="19.78" x2="5.64" y2="18.36" /><line x1="18.36" y1="5.64" x2="19.78" y2="4.22" /></>}
                {name === 'moon' && <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />}
                {name === 'left' && <polyline points="15 18 9 12 15 6" />}
                {name === 'right' && <polyline points="9 18 15 12 9 6" />}
                {name === 'bolt' && <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />}
                {name === 'reset' && <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />}
                {name === 'pen' && <path d="M12 19l7-7 3 3-7 7-3-3z M18 13l-1.5-1.5 M2 22l5-5" />}
                {name === 'hash' && <><line x1="4" y1="9" x2="20" y2="9" /><line x1="4" y1="15" x2="20" y2="15" /><line x1="10" y1="3" x2="8" y2="21" /><line x1="16" y1="3" x2="14" y2="21" /></>}
                {name === 'wall' && <rect x="3" y="11" width="18" height="2" rx="1" />}
            </svg>
        );

        // ── MAIN CREATOR ──────────────────────────────────────────────────────────
        function ZipCreator({ hasAnimated, isDark, toggleTheme }) {
            const [gridSize, setGridSize] = useState(5);
            const [numbers, setNumbers] = useState({});
            const [solutions, setSolutions] = useState([]);
            const [currSolIdx, setCurrSolIdx] = useState(0);
            const [statusType, setStatusType] = useState('ok');
            const [statusMsg, setStatusMsg] = useState('Tap cells to place numbers');
            const [solverRunning, setSolverRunning] = useState(false);
            const [animIndex, setAnimIndex] = useState(0);
            const [displayTime, setDisplayTime] = useState(0);
            const [editMode, setEditMode] = useState('numbers'); // 'numbers', 'walls'
            const [walls, setWalls] = useState({ h: {}, v: {} });
            const canvasRef = useRef(null);

            const [windowSize, setWindowSize] = useState({ w: window.innerWidth, h: window.innerHeight });
            useEffect(() => {
                const handle = () => setWindowSize({ w: window.innerWidth, h: window.innerHeight });
                window.addEventListener('resize', handle);
                return () => window.removeEventListener('resize', handle);
            }, []);

            const isDesktop = windowSize.w >= 860;
            const DASHBOARD_WIDTH = isDesktop ? 440 : Math.min(windowSize.w - 48, 440);
            const PADDING = isDesktop ? 24 : 16;
            const availableGridSize = DASHBOARD_WIDTH - (PADDING * 2);

            // Precision sizing to eliminate "gray space gaps"
            const cellSize = availableGridSize / gridSize;
            const gridWidth = availableGridSize;

            const ballSize = Math.round(cellSize * 0.58);
            const fontSize = Math.round(cellSize * 0.28);
            const lineWidth = Math.round(cellSize * 0.20);
            const nextNumber = Object.keys(numbers).length + 1;

            const handleCellClick = (r, c) => {
                if (solverRunning || editMode !== 'numbers') return;
                const k = `${r},${c}`;
                let newNums;
                if (numbers[k]) {
                    newNums = { ...numbers }; delete newNums[k];
                    const rI = {}; Object.entries(newNums).sort((a, b) => a[1] - b[1]).forEach(([p, _], i) => { rI[p] = i + 1; });
                    newNums = rI;
                } else {
                    newNums = { ...numbers, [k]: nextNumber };
                }
                setNumbers(newNums); setSolutions([]);
                const count = Object.keys(newNums).length;
                if (count === 0) setStatusMsg('Tap cells to place numbers');
                else if (count === 1) setStatusMsg('Place at least 2 numbers');
                else setStatusMsg('Ready to Solve!');
                setStatusType('ok');
            };

            const toggleWall = (type, r, c) => {
                if (solverRunning) return;
                setWalls(prev => {
                    const next = { ...prev, [type]: { ...prev[type] } };
                    const k = `${r},${c}`;
                    if (next[type][k]) delete next[type][k];
                    else next[type][k] = true;
                    return next;
                });
                setSolutions([]);
            };

            const handleSolve = () => {
                if (Object.keys(numbers).length < 2) { setStatusType('err'); setStatusMsg('Add 2+ numbers first.'); return; }
                const solver = new ZipSolver(gridSize, numbers, walls);
                const t0 = performance.now();
                const results = solver.solve();
                const t1 = performance.now();
                setDisplayTime(0);
                if (results.length > 0) {
                    setSolutions(results); setCurrSolIdx(0); setSolverRunning(true); setAnimIndex(0);
                    setStatusType('done'); setStatusMsg(`${results.length >= 50 ? '50+' : results.length} Solutions!`);
                } else { setStatusType('err'); setStatusMsg('No solution exists.'); }
            };
            const handleReset = () => {
                setNumbers({});
                setWalls({ h: {}, v: {} });
                setSolutions([]);
                setCurrSolIdx(0);
                setSolverRunning(false);
                setAnimIndex(0);
                setDisplayTime(0);
                setStatusType('ok');
                setStatusMsg('Tap cells to place numbers');
            };


            useLayoutEffect(() => {
                const canvas = canvasRef.current; if (!canvas) return;
                const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (!solutions.length) return;
                const path = solutions[currSolIdx].path;
                const drawLimit = solverRunning ? animIndex + 1 : path.length;

                ctx.lineWidth = lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                for (let i = 1; i < drawLimit; i++) {
                    ctx.beginPath();
                    ctx.moveTo(path[i - 1][1] * cellSize + cellSize / 2, path[i - 1][0] * cellSize + cellSize / 2);
                    ctx.lineTo(path[i][1] * cellSize + cellSize / 2, path[i][0] * cellSize + cellSize / 2);

                    // Dynamic color flow: from lighter yellow-orange to deep red-orange
                    const progress = i / path.length;
                    const hue = 50 - (progress * 40); // Hue shifts from 50 (yellow/orange) to 10 (red)
                    const lightness = 65 - (progress * 20); // Lightness from 65% to 45%
                    ctx.strokeStyle = `hsl(${hue}, 100%, ${lightness}%)`;
                    ctx.stroke();
                }
            }, [solutions, currSolIdx, solverRunning, animIndex, cellSize, gridWidth]);

            useEffect(() => {
                if (!solverRunning || !solutions.length) return;
                const path = solutions[currSolIdx].path;
                const totalT = parseFloat(solutions[currSolIdx].time);
                const interval = setInterval(() => {
                    setAnimIndex(idx => {
                        if (idx >= path.length - 1) {
                            clearInterval(interval);
                            setSolverRunning(false);
                            setDisplayTime(totalT);
                            return idx;
                        }
                        const progress = (idx + 1) / path.length;
                        setDisplayTime(parseFloat((totalT * progress).toFixed(2)));
                        return idx + 1;
                    });
                }, 25);
                return () => clearInterval(interval);
            }, [solverRunning, currSolIdx, solutions]);

            const anim = hasAnimated ? '' : 'initial-fade';

            return (
                <div className="page-wrap">
                    <div className="top-bar initial-fade">
                        <div className="theme-toggle glass-bright" onClick={toggleTheme}>
                            <Icon name={isDark ? 'sun' : 'moon'} size={20} style={{ color: isDark ? '#fbbf24' : '#64748b' }} />
                        </div>
                    </div>

                    <header className={anim} style={{ textAlign: 'center', marginBottom: 20, width: '100%', maxWidth: 1100 }}>
                        <h1 style={{ fontSize: 'clamp(2.5rem, 6vw, 3.2rem)', fontWeight: 800, letterSpacing: '-0.04em' }}>
                            Zip <span style={{ color: 'var(--accent)' }}>Creator</span>
                        </h1>
                    </header>

                    <main className={`content-row ${anim}`}>
                        <div className="grid-wrap" style={{ width: DASHBOARD_WIDTH, height: DASHBOARD_WIDTH }}>
                            <div className="glass-bright" style={{ borderRadius: 24, padding: PADDING, height: '100%', width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                <div style={{ position: 'relative', width: '100%', height: '100%', borderRadius: 12, overflow: 'hidden', background: 'var(--grid-bg)' }}>
                                    <canvas ref={canvasRef} width={gridWidth} height={gridWidth} style={{ position: 'absolute', inset: 0, zIndex: 5, pointerEvents: 'none', width: '100%', height: '100%' }} />
                                    <div style={{
                                        display: 'grid',
                                        gridTemplateColumns: `repeat(${gridSize}, 1fr)`,
                                        gridTemplateRows: `repeat(${gridSize}, 1fr)`,
                                        width: '100%',
                                        height: '100%'
                                    }}>
                                        {Array.from({ length: gridSize * gridSize }).map((_, i) => {
                                            const r = Math.floor(i / gridSize), c = i % gridSize, n = numbers[`${r},${c}`];
                                            const hasRWall = walls.v[`${r},${c}`];
                                            const hasBWall = walls.h[`${r},${c}`];

                                            return (
                                                <div key={i} className={`cell ${c < gridSize - 1 ? 'cell-border-r' : ''} ${r < gridSize - 1 ? 'cell-border-b' : ''} ${editMode === 'walls' ? 'no-hover' : ''}`} onClick={() => handleCellClick(r, c)}>
                                                    {n && <div className="num-ball" style={{ width: ballSize, height: ballSize, fontSize: fontSize }}>{n}</div>}

                                                    {/* Wall Zones */}
                                                    {editMode === 'walls' && c < gridSize - 1 && (
                                                        <div
                                                            onClick={(e) => { e.stopPropagation(); toggleWall('v', r, c); }}
                                                            className="wall-zone-v"
                                                            style={{ position: 'absolute', right: -8, top: 0, bottom: 0, width: 16, zIndex: 100, cursor: 'pointer' }}
                                                        />
                                                    )}
                                                    {editMode === 'walls' && r < gridSize - 1 && (
                                                        <div
                                                            onClick={(e) => { e.stopPropagation(); toggleWall('h', r, c); }}
                                                            className="wall-zone-h"
                                                            style={{ position: 'absolute', bottom: -8, left: 0, right: 0, height: 16, zIndex: 100, cursor: 'pointer' }}
                                                        />
                                                    )}

                                                    {/* Wall Visuals */}
                                                    {hasRWall && (
                                                        <div style={{ position: 'absolute', right: -2, top: 0, bottom: 0, width: 4, background: 'var(--wall-color)', zIndex: 50, boxShadow: '0 0 10px var(--accent-glow)' }} />
                                                    )}
                                                    {hasBWall && (
                                                        <div style={{ position: 'absolute', bottom: -2, left: 0, right: 0, height: 4, background: 'var(--wall-color)', zIndex: 50, boxShadow: '0 0 10px var(--accent-glow)' }} />
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="sidebar-wrap" style={{ width: DASHBOARD_WIDTH, height: isDesktop ? DASHBOARD_WIDTH : 'auto', minHeight: isDesktop ? 'auto' : DASHBOARD_WIDTH }}>
                            <div className="glass" style={{ borderRadius: 24, padding: PADDING, height: isDesktop ? '100%' : 'auto', width: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                                <div style={{ marginBottom: 20, display: 'flex', gap: 10 }}>
                                    <button
                                        className={`btn-ghost flex-1 py-3 px-2 rounded-2xl flex items-center justify-center gap-2 ${editMode === 'numbers' ? 'status-ok' : ''}`}
                                        onClick={() => setEditMode('numbers')}
                                    >
                                        <Icon name="hash" size={14} />
                                        NUMS
                                    </button>
                                    <button
                                        className={`btn-ghost flex-1 py-3 px-2 rounded-2xl flex items-center justify-center gap-2 ${editMode === 'walls' ? 'status-ok' : ''}`}
                                        onClick={() => setEditMode('walls')}
                                    >
                                        <Icon name="wall" size={14} />
                                        WALLS
                                    </button>
                                </div>

                                <div style={{ marginBottom: 20 }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                                        <span style={{ fontSize: '0.65rem', fontWeight: 800, color: 'var(--text-primary)' }}>GRID SCALE</span>
                                        <span style={{ fontSize: '0.75rem', fontWeight: 800, color: 'var(--accent)' }}>{gridSize}×{gridSize}</span>
                                    </div>
                                    <input type="range" min="3" max="9" value={gridSize} onChange={e => { setGridSize(parseInt(e.target.value)); setNumbers({}); setSolutions([]); }} />
                                </div>

                                <div className={`status-${statusType}`} style={{ borderRadius: 18, padding: '16px', border: '1px solid', marginBottom: 16 }}>
                                    <p style={{ fontSize: '0.73rem', fontWeight: 700 }}>{statusMsg}</p>
                                    {solutions.length > 1 && (
                                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, marginTop: 14 }}>
                                            <button className="btn-nav" onClick={() => { setCurrSolIdx(i => (i - 1 + solutions.length) % solutions.length); setAnimIndex(0); setSolverRunning(true); }}>
                                                <Icon name="left" size={14} />
                                            </button>
                                            <span style={{ fontSize: '0.68rem', fontWeight: 800 }}>{currSolIdx + 1} / {solutions.length}</span>
                                            <button className="btn-nav" onClick={() => { setCurrSolIdx(i => (i + 1) % solutions.length); setAnimIndex(0); setSolverRunning(true); }}>
                                                <Icon name="right" size={14} />
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <div className="glass-bright" style={{
                                    borderRadius: 18,
                                    padding: '12px 14px',
                                    border: '1px solid var(--border-bright)',
                                    marginBottom: 16,
                                    display: 'flex',
                                    justifyContent: 'center',
                                    alignItems: 'center',
                                    gap: 10
                                }}>
                                    <div style={{ width: 6, height: 6, borderRadius: '50%', background: solutions.length > 0 ? '#b91c1c' : 'var(--text-dim)' }}></div>
                                    <span style={{ fontSize: '0.85rem', fontWeight: 800, color: '#b91c1c', letterSpacing: '0.02em' }}>
                                        {displayTime}ms
                                    </span>
                                </div>

                                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                                    <button className="btn-primary" style={{ padding: '14px', borderRadius: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10 }} onClick={handleSolve}>
                                        <Icon name="bolt" size={16} />
                                        SOLVE ALL
                                    </button>
                                    <button className="btn-ghost" style={{ padding: '12px', borderRadius: 16, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10 }} onClick={handleReset}>
                                        <Icon name="reset" size={16} />
                                        RESET
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>

                    <footer className={`footer ${anim}`}>
                        <p style={{ fontSize: '0.62rem', color: 'var(--text-primary)', fontStyle: 'italic', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Developed by <span style={{ color: 'var(--text-primary)' }}>Akshay Gurav</span></p>
                        <div style={{ display: 'flex', justifyContent: 'center', gap: 14 }}>
                            <a href="https://www.linkedin.com/in/akshay---gurav/" target="_blank" style={{ color: '#0077b5', fontSize: 20 }}><i className="fa-brands fa-linkedin"></i></a>
                            <a href="https://github.com/Akshay-gurav-31" target="_blank" style={{ color: 'var(--text-primary)', fontSize: 20 }}><i className="fa-brands fa-github"></i></a>
                        </div>
                    </footer>
                </div>
            );
        }

        function App() {
            const [isDark, setIsDark] = useState(() => {
                const s = localStorage.getItem('sTheme'); return s !== null ? JSON.parse(s) : true;
            });
            const [hasAnimated, setHasAnimated] = useState(false);

            useEffect(() => {
                localStorage.setItem('sTheme', JSON.stringify(isDark));
                document.documentElement.className = isDark ? 'theme-dark' : 'theme-light';
            }, [isDark]);

            useEffect(() => { const t = setTimeout(() => setHasAnimated(true), 800); return () => clearTimeout(t); }, []);

            const toggleTheme = () => setIsDark(!isDark);

            return (
                <ZipCreator
                    hasAnimated={hasAnimated}
                    isDark={isDark}
                    toggleTheme={toggleTheme}
                />
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
